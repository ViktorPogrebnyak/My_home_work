plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('testRunOver') {
    doLast {
        println 'Test run is over'
    }
}

tasks.named('test') {
    useJUnitPlatform {
        includeTags 'homework', 'assertion'
    }
    finalizedBy 'testRunOver'
}

tasks.register('assertionTests', Test) {
    description = 'Runs only the assertion examples tagged with assertion.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'assertion'
    }
    finalizedBy 'testRunOver'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}
